<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F2F2" />
    <!-- The brand beet sits on its own light-green disc, so it reads on both
         light and dark browser chrome — one icon covers both schemes. -->
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <script>
      /* Set the theme before the first paint so a night visit never flashes
         the light palette. Mirrors the rule in src/theme.js. */
      (function () {
        try {
          var pref = localStorage.getItem('themePref');
          var t;
          if (pref === 'light' || pref === 'dark') {
            t = pref;
          } else {
            var h = new Date().getHours();
            t = (h >= 20 || h < 6) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#101010' : '#F2F2F2');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Find and rate Ukraine's best borshch on one map. Every bowl is scored on seven criteria by people who actually ate it. Free, no ads." />

    <!-- Прев'ю посилання. Без цих тегів шер мапи в X, Telegram, LinkedIn чи Slack
         давав ПОРОЖНЮ картку, а описом сторінки лишався дефолт create-react-app —
         той самий рядок, що стояв тут роками. Це помітили перед лончем на
         Product Hunt, де мапа мала бути основним посиланням.

         Тексти англійською свідомо: картку читає той, кому посилання переслали,
         і найчастіше це не українськомовна людина. Українське прев'ю є в
         лендінгу (navernyborshchu.com), у якого свої og-теги.

         og-map.jpg лежить статичним файлом і свідомо БЕЗ чисел на ньому:
